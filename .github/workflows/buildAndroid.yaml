name: Build & Release Android APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build split APKs (armeabi-v7a, arm64-v8a, x86_64)
        run: flutter build apk --release --split-per-abi

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          VERSION_CODE=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Read changelog from fastlane
        id: changelog
        run: |
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.version_code }}.txt"
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "Error: No se encontró $CHANGELOG_FILE"
            exit 1
          fi
          DELIMITER="CHANGELOG_$(date +%s)_$RANDOM"
          {
            echo "body<<$DELIMITER"
            cat "$CHANGELOG_FILE"
            echo "$DELIMITER"
          } >> $GITHUB_OUTPUT

      - name: Rename APKs with architecture suffix
        run: |
          cd build/app/outputs/flutter-apk
          mv app-armeabi-v7a-release.apk  "ImpostorMX-v${{ steps.version.outputs.version }}-armeabi-v7a.apk"
          mv app-arm64-v8a-release.apk    "ImpostorMX-v${{ steps.version.outputs.version }}-arm64-v8a.apk"
          mv app-x86_64-release.apk       "ImpostorMX-v${{ steps.version.outputs.version }}-x86_64.apk"

      - name: Create GitHub Release with all APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Impostor MX v${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          files: |
            build/app/outputs/flutter-apk/ImpostorMX-v${{ steps.version.outputs.version }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/ImpostorMX-v${{ steps.version.outputs.version }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/ImpostorMX-v${{ steps.version.outputs.version }}-x86_64.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: |
          rm -f android/app/keystore.jks
          rm -f android/key.properties